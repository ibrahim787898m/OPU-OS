<meta name="theme-color" content="#0a0c10">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0c10; --panel:#11141b; --panel2:#161a23; --line:#222836; --line2:#2c3343;
  --text:#e7eaf0; --dim:#8a93a6; --faint:#566074;
  --acc:#b8f34a; --acc-d:rgba(184,243,74,.12); --blue:#6ea8fe; --pink:#ff7ab6; --amber:#ffc65c; --red:#ff6b6b;
  --r:14px; --mono:'JetBrains Mono',ui-monospace,monospace; --sans:'Space Grotesk',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background:
  radial-gradient(900px 500px at 85% -10%,rgba(184,243,74,.07),transparent 60%),
  radial-gradient(700px 500px at -10% 110%,rgba(110,168,254,.06),transparent 60%);z-index:0}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--blue);text-decoration:none} a:hover{text-decoration:underline}
.mono{font-family:var(--mono)}
.i{width:1.05em;height:1.05em;vertical-align:-.17em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.iconbtn .i{width:16px;height:16px;vertical-align:0}
.label{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}

/* ---------- lock screen ---------- */
#lock{position:fixed;inset:0;display:grid;place-items:center;z-index:50;background:var(--bg)}
#lock .box{width:min(400px,90vw);position:relative;z-index:1}
#lock h1{font-size:44px;letter-spacing:-.03em;line-height:1}
#lock h1 span{color:var(--acc)}
#lock p{color:var(--dim);margin:10px 0 28px}
#lock input{width:100%;padding:14px 16px;background:var(--panel);border:1px solid var(--line2);border-radius:10px;font-family:var(--mono);outline:none}
#lock input:focus{border-color:var(--acc)}
#lock .err{color:var(--red);font-size:13px;min-height:20px;margin-top:8px;font-family:var(--mono)}
.grid-bg{position:fixed;inset:0;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:44px 44px;opacity:.25;mask-image:radial-gradient(circle at center,#000 0,transparent 70%)}

/* ---------- layout ---------- */
#app{display:none;position:relative;z-index:1;min-height:100vh}
#app.on{display:grid;grid-template-columns:240px minmax(0,1fr);align-content:start;transition:grid-template-columns .2s}
aside{position:sticky;top:0;height:100vh;overflow-y:auto;border-right:1px solid var(--line);padding:22px 14px;display:flex;flex-direction:column;gap:4px;background:rgba(10,12,16,.7);backdrop-filter:blur(8px)}
.brand{font-weight:700;font-size:20px;letter-spacing:-.02em;padding:0 4px 18px 10px;display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.iconbtn{background:none;border:1px solid var(--line2);border-radius:8px;color:var(--dim);cursor:pointer;width:30px;height:30px;display:grid;place-items:center;font-size:14px;flex:none;padding:0}
.iconbtn:hover{color:var(--text);border-color:var(--faint)}
.mtop,.scrim,.mback{display:none}
.cmd{display:flex;align-items:center;gap:8px;text-align:left}.cmd kbd{margin-left:auto}
.brand .bt>span{color:var(--acc)}
.brand small{display:block;font-family:var(--mono);font-size:10px;color:var(--faint);letter-spacing:.14em;font-weight:400;margin-top:2px}
.nav{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:9px;color:var(--dim);cursor:pointer;border:1px solid transparent;background:none;width:100%;text-align:left}
.nav:hover{color:var(--text);background:var(--panel)}
.nav.on{color:var(--text);background:var(--panel2);border-color:var(--line2)}
.nav.on .ico{color:var(--acc)}
.nav .ico{width:18px;text-align:center;font-family:var(--mono);font-size:13px}
.nav kbd{margin-left:auto}
kbd{font-family:var(--mono);font-size:10px;padding:2px 6px;border:1px solid var(--line2);border-radius:5px;color:var(--faint)}
.side-bottom{margin-top:auto;display:flex;flex-direction:column;gap:10px}
.timer{border:1px solid var(--line2);border-radius:12px;padding:12px;background:var(--panel)}
.timer .t{font-family:var(--mono);font-size:28px;font-weight:700;letter-spacing:-.02em}
.timer.run .t{color:var(--acc)}
.timer .row{display:flex;gap:6px;margin-top:8px}
main{padding:34px 40px 80px;max-width:1680px;width:100%;margin:0 auto}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:26px;flex-wrap:wrap}
.head h2{font-size:32px;letter-spacing:-.03em;line-height:1.1}
.head .sub{color:var(--dim);margin-top:4px}

/* ---------- components ---------- */
.btn{padding:8px 14px;border-radius:9px;border:1px solid var(--line2);background:var(--panel2);cursor:pointer;font-size:14px;white-space:nowrap}
.btn:hover{border-color:var(--faint)}
.btn.pri{background:var(--acc);color:#0a0c10;border-color:var(--acc);font-weight:600}
.btn.pri:hover{filter:brightness(1.08)}
.btn.sm{padding:4px 10px;font-size:12px;border-radius:7px}
.btn.ghost{background:none}
.btn.danger{color:var(--red)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.card h3{font-size:13px;font-family:var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--dim);font-weight:500;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.g{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.span2{grid-column:span 2}.span3{grid-column:span 3}
.stat .v{font-size:34px;font-weight:700;letter-spacing:-.03em;line-height:1.1}
.stat .v small{font-size:15px;color:var(--dim);font-weight:500}
.stat .k{margin-top:6px}
.meter{height:6px;background:var(--line);border-radius:4px;overflow:hidden;margin-top:12px}
.meter i{display:block;height:100%;background:var(--acc);border-radius:4px;transition:width .6s}
.pill{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:11px;padding:2px 8px;border-radius:20px;border:1px solid var(--line2);color:var(--dim);white-space:nowrap}
.pill.todo{color:var(--dim)}
.pill.doing{color:var(--amber);border-color:rgba(255,198,92,.35)}
.pill.done{color:var(--acc);border-color:rgba(184,243,74,.35)}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor;display:inline-block}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:none}
.li .grow{flex:1;min-width:0}
.li .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.muted{color:var(--dim)} .faint{color:var(--faint)}
.empty{color:var(--faint);font-family:var(--mono);font-size:13px;padding:14px 0}
.clickable{cursor:pointer}
.clickable:hover{border-color:var(--line2)}
.hero{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;flex-wrap:wrap;margin-bottom:26px}
.hero h2{font-size:40px;letter-spacing:-.035em;line-height:1.05}
.hero h2 em{font-style:normal;color:var(--acc)}
.chips{display:flex;gap:8px;flex-wrap:wrap}

/* roadmap */
.track{display:flex;flex-direction:column;gap:8px}
.step{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel2)}
.step .n{font-family:var(--mono);font-size:11px;color:var(--faint);width:22px}
.step.done .title{color:var(--dim);text-decoration:line-through;text-decoration-color:var(--faint)}
.step .title{flex:1}

/* kanban */
.kanban{display:grid;grid-template-columns:repeat(5,minmax(200px,1fr));gap:12px;overflow-x:auto;padding-bottom:6px}
.col{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px;min-height:200px}
.col h4{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);font-weight:500;margin-bottom:10px;display:flex;justify-content:space-between}
.jcard{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;cursor:pointer}
.jcard:hover{border-color:var(--line2)}
.jcard .co{font-weight:600}
.jcard .ro{color:var(--dim);font-size:13px}
.jcard .ft{display:flex;justify-content:space-between;align-items:center;margin-top:8px}
.jcard .mv{display:flex;gap:4px}
.due{color:var(--amber)} .over{color:var(--red)}

/* skills */
.lvl{display:flex;gap:4px}
.lvl i{width:22px;height:6px;border-radius:3px;background:var(--line2)}
.lvl i.on{background:var(--acc)}

/* notes */
.notes{display:grid;grid-template-columns:210px 290px minmax(0,1fr);gap:16px;min-height:70vh}
.notes.j{grid-template-columns:290px minmax(0,1fr)}
.notes.lib{grid-template-columns:330px minmax(0,1fr);gap:22px}
.notes.lib.focus{grid-template-columns:minmax(0,1fr)}.notes.lib.focus>.npanel{display:none}
.notes.lib .editor{max-width:1040px;width:100%}.notes.lib.focus .editor{margin:0 auto}
.npanel{display:flex;flex-direction:column;gap:10px;position:sticky;top:18px;align-self:start;max-height:calc(100vh - 36px)}
.npanel .nlist{flex:1;max-height:none;min-height:160px;overflow:auto;padding-right:2px}
.npanel .tchips{margin:0}
.nrow{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}.nrow .seg button{padding:5px 10px;font-size:12px}
.nsel{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.nsel select{background:var(--panel);border:1px solid var(--line2);border-radius:9px;padding:7px 8px;font-size:13px;outline:none;min-width:0;color:var(--text)}
.nsel select:focus{border-color:var(--acc)}
/* code viewer */
.codebox{display:flex;background:#07080b;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;min-height:50vh}
.codebox pre{margin:0;padding:16px 0;font-family:var(--mono);font-size:13px;line-height:1.65}
.codebox .lnums{padding:16px 12px 16px 14px;text-align:right;color:var(--faint);user-select:none;border-right:1px solid var(--line);background:rgba(255,255,255,.015);flex:none}
.codebox .src{padding:16px 18px;overflow-x:auto;flex:1;tab-size:4}
.hk{color:#ff7ab6}.hs{color:#b8f34a}.hc{color:#566074;font-style:italic}.hn{color:#ffc65c}.hf{color:#6ea8fe}
.codestats{display:flex;gap:28px;align-items:center;flex-wrap:wrap}
.cs-nums{display:flex;gap:28px}.cs-nums .v{font-size:26px;font-weight:700;letter-spacing:-.02em}.cs-nums .v small{font-size:14px;color:var(--dim)}.nsel select:disabled{color:var(--faint)}
.nlist{display:flex;flex-direction:column;gap:6px;overflow:auto;max-height:78vh}
.nside{display:flex;flex-direction:column;gap:14px;max-height:78vh;overflow:auto}
.search{width:100%;padding:8px 12px;background:var(--panel);border:1px solid var(--line2);border-radius:9px;outline:none;font-size:14px}
.search:focus{border-color:var(--acc)}
.tree{display:flex;flex-direction:column;gap:2px}
.tree button{display:flex;justify-content:space-between;gap:8px;width:100%;text-align:left;background:none;border:1px solid transparent;border-radius:7px;padding:5px 8px;color:var(--dim);cursor:pointer;font-size:13px}
.tree button:hover{color:var(--text);background:var(--panel)}
.tree button.on{color:var(--text);background:var(--panel2);border-color:var(--line2)}
.tree button.sub{padding-left:20px;font-size:12.5px}
.tree button span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tree button span:last-child{font-family:var(--mono);font-size:11px;color:var(--faint)}
.tchips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.tchip{font-family:var(--mono);font-size:11px;padding:3px 9px;border-radius:20px;border:1px solid var(--line2);background:none;color:var(--dim);cursor:pointer}
.tchip.on{color:#0a0c10;background:var(--acc);border-color:var(--acc)}
.tchip i{font-style:normal;opacity:.6;margin-left:4px}
.ty{font-family:var(--mono);font-size:10px;padding:1px 7px;border-radius:20px;border:1px solid var(--line2);text-transform:uppercase;letter-spacing:.06em;white-space:nowrap;color:var(--dim)}
.ty-lesson{color:var(--blue);border-color:rgba(110,168,254,.35)}.ty-quiz{color:var(--amber);border-color:rgba(255,198,92,.35)}.ty-practice{color:var(--pink);border-color:rgba(255,122,182,.35)}.ty-reflection,.ty-review{color:var(--acc);border-color:rgba(184,243,74,.35)}
.nitem .meta{display:flex;align-items:center;gap:6px;margin-top:4px;font-size:11px;color:var(--faint);font-family:var(--mono);overflow:hidden;white-space:nowrap}
.nmeta{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.nmeta input,.nmeta select{background:var(--panel);border:1px solid var(--line2);border-radius:8px;padding:5px 9px;font-size:13px;outline:none;min-width:0}
.nmeta input:focus,.nmeta select:focus{border-color:var(--acc)}
.mood{display:inline-flex;gap:2px}.mood button{background:none;border:1px solid transparent;border-radius:7px;cursor:pointer;font-size:17px;padding:1px 4px;opacity:.35}.mood button.on{opacity:1;border-color:var(--line2);background:var(--panel2)}
.nitem{padding:10px 12px;border:1px solid var(--line);border-radius:10px;cursor:pointer;background:var(--panel)}
.nitem.on{border-color:var(--acc);background:var(--acc-d)}
.nitem .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.editor{display:flex;flex-direction:column;gap:10px}
.editor input.title{font-size:26px;font-weight:700;background:none;border:none;outline:none;letter-spacing:-.02em}
.editor textarea{flex:1;min-height:55vh;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;font-family:var(--mono);font-size:14px;line-height:1.7;outline:none;resize:vertical}
.editor textarea:focus{border-color:var(--line2)}
.prose{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:20px 24px;min-height:55vh;line-height:1.7}
.prose h1,.prose h2,.prose h3{margin:14px 0 6px;letter-spacing:-.02em}
.prose code{font-family:var(--mono);background:var(--panel2);padding:1px 6px;border-radius:5px;font-size:13px}
.prose pre{background:#07080b;border:1px solid var(--line);padding:12px;border-radius:10px;overflow:auto;margin:10px 0}
.prose pre code{background:none;padding:0}
.prose ul,.prose ol{padding-left:22px;margin:6px 0}
.prose ul.tasks{list-style:none;padding-left:4px}
.prose li{margin:2px 0}
.prose p{margin:4px 0}
.prose h4{margin:12px 0 4px}
.prose table{border-collapse:collapse;margin:10px 0;width:auto;max-width:100%;display:block;overflow:auto}
.prose th,.prose td{border:1px solid var(--line2);padding:6px 10px;font-size:13.5px;text-transform:none;letter-spacing:0;font-family:var(--sans);color:var(--text)}
.prose th{background:var(--panel2);font-weight:600}
.prose blockquote{border-left:3px solid var(--line2);padding:4px 14px;color:var(--dim);margin:10px 0}
.prose hr{border:none;border-top:1px solid var(--line);margin:16px 0}
.prose input[type=checkbox]{margin-right:7px;accent-color:var(--acc)}
.prose pre.txt{white-space:pre-wrap;font-family:var(--mono);font-size:13px;background:none;border:none;padding:0;margin:0}

/* weekly plan */
.days{display:flex;flex-direction:column;gap:8px}
.day{display:grid;grid-template-columns:22px 96px minmax(0,1fr);gap:12px;align-items:start;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--panel2)}
.day.today{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-d)}
.day.done .pl{color:var(--dim)}
.day .dn{font-weight:600;font-size:14px}.day .fo{font-family:var(--mono);font-size:11px;color:var(--dim);margin-top:2px}
.day .pl{font-size:14px}
.ck{width:20px;height:20px;border-radius:6px;border:1.5px solid var(--line2);background:none;cursor:pointer;display:grid;place-items:center;color:transparent;font-size:12px;font-weight:700;padding:0;flex:none;margin-top:1px}
.ck:hover{border-color:var(--acc)}
.ck.on{background:var(--acc);border-color:var(--acc);color:#0a0c10}
.oc{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.oc:last-child{border-bottom:none}
.oc.done .tx{color:var(--dim);text-decoration:line-through;text-decoration-color:var(--faint)}
.watch li{margin-bottom:8px;font-size:14px;color:var(--dim)}
details.more summary{cursor:pointer;color:var(--dim);font-family:var(--mono);font-size:12px;list-style:none}
details.more summary::-webkit-details-marker{display:none}
details.more summary::before{content:'▸ '}details.more[open] summary::before{content:'▾ '}
.banner{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;border:1px solid rgba(184,243,74,.35);background:var(--acc-d);border-radius:12px;margin-bottom:16px;font-size:14px}
.rv textarea{width:100%;min-height:54px;background:var(--panel2);border:1px solid var(--line2);border-radius:9px;padding:8px 12px;outline:none;resize:vertical;font-size:14px}
.rv textarea:focus{border-color:var(--acc)}

/* leetcode */
.lc td{vertical-align:top}
.lc .ins{font-size:12.5px;color:var(--faint);margin-top:3px}
.lc tr.mis td:first-child{box-shadow:inset 2px 0 var(--red)}
.d-Easy{color:var(--acc)}.d-Medium{color:var(--amber)}.d-Hard{color:var(--red)}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:9px;overflow:hidden}
.seg button{padding:6px 12px;background:none;border:none;cursor:pointer;color:var(--dim);font-size:13px}
.seg button.on{background:var(--panel2);color:var(--text)}

/* github */
.repo{display:flex;flex-direction:column;gap:6px}
.lang{display:flex;height:10px;border-radius:5px;overflow:hidden;margin:6px 0 12px}
.ev{font-family:var(--mono);font-size:12.5px}

/* table */
table{width:100%;border-collapse:collapse}
th{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);font-weight:500;text-align:left;padding:8px 10px;border-bottom:1px solid var(--line2)}
td{padding:10px;border-bottom:1px solid var(--line);font-size:14px}
tr:hover td{background:rgba(255,255,255,.015)}

/* modal / palette */
.overlay{position:fixed;inset:0;background:rgba(5,6,9,.72);backdrop-filter:blur(4px);display:none;align-items:flex-start;justify-content:center;padding-top:10vh;z-index:40}
.overlay.on{display:flex}
.modal{width:min(520px,92vw);background:var(--panel);border:1px solid var(--line2);border-radius:16px;padding:22px;box-shadow:0 30px 80px rgba(0,0,0,.5);max-height:80vh;overflow:auto}
.modal h3{font-size:20px;margin-bottom:16px;letter-spacing:-.02em}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.field input,.field select,.field textarea{background:var(--panel2);border:1px solid var(--line2);border-radius:9px;padding:9px 12px;outline:none}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--acc)}
.field textarea{min-height:90px;resize:vertical}
.mfoot{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}
.mfoot .left{margin-right:auto}
.pal{width:min(560px,92vw);background:var(--panel);border:1px solid var(--line2);border-radius:16px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.5)}
.pal input{width:100%;padding:16px 18px;background:none;border:none;border-bottom:1px solid var(--line);outline:none;font-size:16px}
.pal .items{max-height:50vh;overflow:auto;padding:6px}
.pal .it{padding:10px 12px;border-radius:9px;display:flex;justify-content:space-between;cursor:pointer}
.pal .it.on{background:var(--panel2)}
.pal .it span:last-child{font-family:var(--mono);font-size:11px;color:var(--faint)}
.toast{position:fixed;bottom:22px;right:22px;background:var(--panel2);border:1px solid var(--line2);padding:10px 16px;border-radius:10px;font-family:var(--mono);font-size:13px;z-index:60;opacity:0;transform:translateY(10px);transition:.25s;pointer-events:none}
.toast.on{opacity:1;transform:none}
.status{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:12px}
.linkbtn{background:none;border:none;color:var(--dim);cursor:pointer;font-family:var(--mono);font-size:12px;margin-top:16px;padding:0}
.linkbtn:hover{color:var(--acc)}
.sync{display:flex;align-items:center;gap:7px;background:none;border:1px solid var(--line);border-radius:9px;padding:7px 10px;font-family:var(--mono);font-size:11px;color:var(--dim);cursor:pointer;width:100%;text-align:left}
.sync.ok{color:var(--acc)} .sync.err{color:var(--red)} .sync.busy,.sync.pending{color:var(--amber)}
.steps{padding-left:18px;color:var(--dim);font-size:14px;margin-bottom:12px} .steps li{margin-bottom:4px}
.status.up{color:var(--acc)} .status.down{color:var(--red)} .status.chk{color:var(--dim)}
.pulse{animation:p 1.6s infinite}
@keyframes p{50%{opacity:.35}}
.fade{animation:f .35s ease}
@keyframes f{from{opacity:0;transform:translateY(6px)}}

/* ---------- collapsed sidebar (desktop) ---------- */
#app.on.collapsed{grid-template-columns:68px minmax(0,1fr)}
#app.collapsed aside{padding:22px 10px}
#app.collapsed .lb,#app.collapsed .nav kbd,#app.collapsed .brand .bt,#app.collapsed .cmd kbd,#app.collapsed .timer .label,#app.collapsed .timer .row{display:none}
#app.collapsed .brand{justify-content:center;padding:0 0 18px}
#app.collapsed .collapse{transform:rotate(180deg)}
#app.collapsed .nav{justify-content:center;padding:10px 0}
#app.collapsed .nav .ico{width:auto;font-size:15px}
#app.collapsed .sync,#app.collapsed .cmd{justify-content:center;padding:7px 0}
#app.collapsed .timer{padding:8px 2px;text-align:center;cursor:pointer}
#app.collapsed .timer .t{font-size:12.5px}

/* ---------- medium screens: tighter notes columns ---------- */
@media (max-width:1240px){
  .notes{grid-template-columns:185px 250px minmax(0,1fr)}
  main{padding:30px 28px 80px}
}

/* ---------- mobile / tablet ---------- */
@media (max-width:980px){
  #app.on,#app.on.collapsed{grid-template-columns:minmax(0,1fr)}
  .mtop{display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:30;padding:10px 14px;background:rgba(10,12,16,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
  .brand-m{font-weight:700;font-size:18px;letter-spacing:-.02em;flex:1}.brand-m span{color:var(--acc)}
  #mTimer{color:var(--acc);font-size:13px}
  aside,#app.collapsed aside{position:fixed;left:0;top:0;bottom:0;width:270px;height:100dvh;z-index:46;transform:translateX(-102%);transition:transform .22s ease;background:var(--bg);border-right:1px solid var(--line2);padding:20px 14px}
  #app.drawer aside{transform:none;box-shadow:20px 0 60px rgba(0,0,0,.5)}
  #app.drawer .scrim{display:block;position:fixed;inset:0;z-index:45;background:rgba(5,6,9,.6)}
  /* the drawer always shows full labels */
  #app.collapsed .lb,#app.collapsed .brand .bt{display:inline}#app.collapsed .timer .label{display:block}#app.collapsed .timer .row{display:flex}
  #app.collapsed .nav{justify-content:flex-start;padding:9px 10px}#app.collapsed .nav .ico{width:18px;font-size:13px}#app.collapsed .cmd{justify-content:flex-start;padding:4px 10px}
  #app.collapsed .timer{padding:12px;text-align:left}#app.collapsed .timer .t{font-size:28px}
  #app.collapsed .sync{justify-content:flex-start;padding:7px 10px}#app.collapsed .brand{justify-content:space-between;padding:0 4px 18px 10px}
  .collapse,.nav kbd,.cmd kbd{display:none!important}
  main{padding:20px 14px 60px}
  .head{margin-bottom:18px;gap:12px}.head h2{font-size:26px}.hero h2{font-size:28px}
  .head>.chips,.hero>.chips{width:100%}
  .seg{max-width:100%;overflow-x:auto;scrollbar-width:none}.seg::-webkit-scrollbar{display:none}.seg button{white-space:nowrap;flex:none}
  .g2,.g3{grid-template-columns:minmax(0,1fr)}.g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .span2,.span3,.g4>.card:not(.stat){grid-column:1/-1} /* only small stat tiles share a row */
  .card{overflow-x:auto;padding:14px}
  .stat .v{font-size:24px}.stat .v small{font-size:13px}
  td,th{padding:8px 6px}td{font-size:13px}
  .banner{flex-wrap:wrap}
  /* notes: show the list OR the open note, never three squashed columns */
  .notes,.notes.j,.notes.lib,.notes.lib.focus{grid-template-columns:minmax(0,1fr);min-height:0}
  .npanel{position:static;max-height:none}.notes.lib.focus>.npanel{display:flex}.dfocus{display:none}
  .nside,.nlist{max-height:none}
  .nside .tree{max-height:230px;overflow:auto;border:1px solid var(--line);border-radius:10px;padding:4px}
  .notes:not(.open)>.editor{display:none}
  .notes.open>.nside,.notes.open>.ncol,.notes.lib.open>.npanel{display:none}
  .mback{display:inline-flex;align-self:flex-start}
  .hide-m{display:none!important}
  .codebox{min-height:0}.codebox pre{font-size:12px}.codebox .lnums{padding:16px 8px}
  .editor textarea,.prose{min-height:60vh}
  .editor input.title{font-size:22px}
  .day{grid-template-columns:22px minmax(0,1fr)}.day .pl{grid-column:2}
  .step{flex-wrap:wrap}.step .title{min-width:60%}
  .kanban{grid-template-columns:repeat(5,minmax(220px,80vw))}
  .toast{left:14px;right:14px;bottom:14px;text-align:center}
}
@media (max-width:340px){
  .g4{grid-template-columns:minmax(0,1fr)}
}
</style>
</head>
<body>

<!-- ============ LOCK ============ -->
<div id="lock">
  <div class="grid-bg"></div>
  <div class="box fade">
    <div class="label" style="margin-bottom:14px">// command center</div>
    <h1>OPU<span>/</span>OS</h1>
    <p id="lockMsg">Enter your passphrase.</p>
    <form id="lockForm">
      <input id="lockInput" type="password" placeholder="passphrase" autocomplete="current-password" autofocus>
      <div class="err" id="lockErr"></div>
      <button class="btn pri" style="width:100%;padding:12px;margin-top:6px" id="lockBtn">Unlock →</button>
    </form>
    <button class="linkbtn" id="restoreToggle" type="button"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 2.6-6.4L3 8"/><path d="M3 3v5h5"/></svg> Restore from GitHub Gist</button>
    <form id="restoreForm" style="display:none;margin-top:14px">
      <input id="restoreToken" type="password" placeholder="GitHub token (gist scope)" autocomplete="off">
      <div class="err" id="restoreErr"></div>
      <button class="btn" style="width:100%;padding:12px;margin-top:6px" id="restoreBtn">Restore my data →</button>
    </form>
  </div>
</div>

<!-- ============ APP ============ -->
<div id="app">
  <!-- mobile top bar (hidden on desktop) -->
  <div class="mtop"><button class="iconbtn" data-act="drawer" aria-label="Menu"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button><div class="brand-m">OPU<span>/</span>OS</div><span class="mono" id="mTimer"></span><button class="iconbtn" data-act="palette" aria-label="Command palette"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6v12a3 3 0 1 0 3-3H6a3 3 0 1 0 3 3V6a3 3 0 1 0-3 3h12a3 3 0 1 0-3-3"/></svg></button></div>
  <div class="scrim" data-act="drawer"></div>
  <aside>
    <div class="brand"><span class="bt">OPU<span>/</span>OS<small>IBRAHIM'S COMMAND CENTER</small></span><button class="iconbtn collapse" data-act="sideToggle" title="Collapse sidebar ( [ )">«</button></div>
    <button class="nav" data-act="go" data-v="dash" title="Dashboard"><span class="ico">◆</span><span class="lb">Dashboard</span><kbd>1</kbd></button>
    <button class="nav" data-act="go" data-v="study" title="Study"><span class="ico">▲</span><span class="lb">Study</span><kbd>2</kbd></button>
    <button class="nav" data-act="go" data-v="skills" title="Skills"><span class="ico">●</span><span class="lb">Skills</span><kbd>3</kbd></button>
    <button class="nav" data-act="go" data-v="projects" title="Projects"><span class="ico">■</span><span class="lb">Projects</span><kbd>4</kbd></button>
    <button class="nav" data-act="go" data-v="career" title="Career"><span class="ico">➜</span><span class="lb">Career</span><kbd>5</kbd></button>
    <button class="nav" data-act="go" data-v="github" title="GitHub"><span class="ico"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="6" cy="18" r="2.5"/><circle cx="18" cy="6" r="2.5"/><path d="M6 3v12.5M18 8.5a9 9 0 0 1-9 9"/></svg></span><span class="lb">GitHub</span><kbd>6</kbd></button>
    <button class="nav" data-act="go" data-v="notes" title="Notes & Journal"><span class="ico">¶</span><span class="lb">Notes &amp; Journal</span><kbd>7</kbd></button>
    <button class="nav" data-act="go" data-v="links" title="Presence"><span class="ico">@</span><span class="lb">Presence</span><kbd>8</kbd></button>
    <button class="nav" data-act="go" data-v="settings" title="Settings"><span class="ico">⚙</span><span class="lb">Settings</span><kbd>9</kbd></button>
    <div class="side-bottom">
      <button class="sync" id="syncInd" data-act="go" data-v="settings"></button>
      <div class="timer" id="timer" data-act="timerBox">
        <div class="label">Focus</div>
        <div class="t" id="timerT">25:00</div>

const ago=iso=>{const m=(Date.now()-new Date(iso))/6e4;if(m<60)return Math.round(m)+'m ago';if(m<1440)return Math.round(m/60)+'h ago';return Math.round(m/1440)+'d ago'};

let S;
function load(){try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){} if(!S)S=seed(),save(); migrate()}
/* Upgrades older saved data in place — never wipes anything. */
function migrate(){

function save(quiet){if(!quiet)S._t=Date.now();
  try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('⚠ Browser storage is full — this change was NOT saved here. Export a backup now.');return}

/* ---------------- cloud sync (private GitHub Gist) ----------------
   Gist file opuos.json = {v, savedAt, hash, data}. Token + gist id live in
   localStorage under opuos.sync (never inside exported data). Newest savedAt wins. */
const SYNC='opuos.sync',GF='opuos.json';
const syncCfg=()=>{try{return JSON.parse(localStorage.getItem(SYNC))}catch(e){return null}};
let syncSt={s:'off',at:0,msg:''},pushT=null,unlocked=false;
async function ghApi(path,opts={},token){
  const t=token||syncCfg()?.token;
  const r=await fetch('https://api.github.com/'+path,{...opts,cache:'no-store',headers:{Authorization:'Bearer '+t,Accept:'application/vnd.github+json',...(opts.body?{'Content-Type':'application/json'}:{})}});
  if(!r.ok)throw new Error(r.status===401?'Invalid or expired token':r.status===404?'Not found — does the token have the gist scope?':r.status===403?'GitHub refused (rate limit or missing gist scope)':'GitHub error '+r.status);
  return r.json();
}
async function findGist(token){
  for(let p=1;p<=5;p++){const l=await ghApi(`gists?per_page=100&page=${p}`,{},token);const g=l.find(x=>x.files&&x.files[GF]);if(g)return g.id;if(l.length<100)break}
  return null;
}
async function readGist(id,token){
  const g=await ghApi('gists/'+id,{},token),f=g.files[GF];
  if(!f)throw new Error('Gist has no '+GF);
  return JSON.parse(f.truncated?await fetch(f.raw_url).then(r=>r.text()):f.content);
}
/* Sync rules (fixed 2026-11-15). "base" = the savedAt of the last version this device
   and the cloud agreed on. Local edits after base = unsynced; cloud savedAt after base =
   changed elsewhere. Both → ask. Nothing is pushed before the first pull of a session,
   and any copy that gets replaced is kept in "opuos.replaced" so it can be restored. */
const BASE='opuos.base',REPL='opuos.replaced';
const getBase=()=>+localStorage.getItem(BASE)||0,setBase=t=>localStorage.setItem(BASE,String(t||0));
function stash(reason){try{if(S)localStorage.setItem(REPL,JSON.stringify({at:Date.now(),reason,savedAt:S._t||0,data:S}))}catch(e){}}
let syncReady=false;
const payload=()=>JSON.stringify({v:1,savedAt:S._t||Date.now(),hash:localStorage.getItem(HKEY),data:S});
function applyRemote(r){S=r.data;migrate();localStorage.setItem(KEY,JSON.stringify(S));setBase(r.savedAt)}
function schedulePush(){if(!syncCfg()?.gistId||!unlocked)return;clearTimeout(pushT);setSync('pending');pushT=setTimeout(pushGist,2500)}
async function pushGist(){
  const c=syncCfg();if(!c?.gistId)return;clearTimeout(pushT);pushT=null;
  if(!syncReady)return pullGist(); // never overwrite the cloud before checking it
  setSync('busy');const t=S._t;
  try{await ghApi('gists/'+c.gistId,{method:'PATCH',body:JSON.stringify({files:{[GF]:{content:payload()}}})});setBase(t);setSync('ok')}
  catch(e){setSync('err',e.message)}
}
async function pullGist(){
  const c=syncCfg();if(!c?.gistId){syncReady=true;return}if(pushT)return;setSync('busy');
  try{
    const r=await readGist(c.gistId),remote=r.savedAt||0,local=S._t||0;
    const base=getBase()||Math.min(remote,local); // no base yet (first run after the fix): old newest-wins rule
    const localDirty=local>base,remoteChanged=remote>base;
    syncReady=true;
    if(remote===local)setBase(remote);
    else if(remoteChanged&&!localDirty){stash('pulled a newer version from the cloud');applyRemote(r);render();toast('Pulled latest from cloud')}
    else if(localDirty&&!remoteChanged){await pushGist();return}
    else if(confirm(`Sync conflict: this device has changes that aren't in the cloud, and the cloud has newer changes from another device (saved ${new Date(remote).toLocaleString()}).\n\nOK → use the CLOUD version (this device's version is kept: Settings → Cloud sync → Version history)\nCancel → keep THIS device's version (the cloud version stays in the history)`)){
      stash('chose the cloud version in a sync conflict');applyRemote(r);render();toast('Using the cloud version')}
    else{setBase(remote);await pushGist();return}
    setSync('ok');
  }catch(e){setSync('err',e.message)}
  syncReady=true;
}
async function connectSync(token){
  setSync('busy');
  try{
    const id=await findGist(token);
    if(id){
      const r=await readGist(id,token);
      localStorage.setItem(SYNC,JSON.stringify({token,gistId:id}));
      if(confirm(`Found existing OPU/OS data in your GitHub (saved ${new Date(r.savedAt).toLocaleString()}).\n\nOK → load the cloud data into this browser\nCancel → overwrite the cloud with this browser's data`)){stash('loaded the cloud data when connecting');applyRemote(r);setSync('ok')}
      else{syncReady=true;await pushGist()}
    }else{
      const g=await ghApi('gists',{method:'POST',body:JSON.stringify({description:'OPU/OS data (do not delete)',public:false,files:{[GF]:{content:payload()}}})},token);
      localStorage.setItem(SYNC,JSON.stringify({token,gistId:g.id}));setBase(S._t);syncReady=true;setSync('ok');
    }
    toast('Cloud sync connected');render();
  }catch(e){setSync('err',e.message);toast(e.message)}
}
function setSync(s,msg=''){syncSt={s,at:Date.now(),msg};if(s==='ok'&&syncCfg()?.gistId)localStorage.setItem('opuos.lastsync',String(Date.now()));const el=$('#syncInd');if(!el)return;
  el.className='sync '+s;el.title=msg;
  el.innerHTML='<span>☁</span><span class="lb">'+{off:'local only',pending:'unsaved changes…',busy:'<span class="pulse">syncing…</span>',ok:'synced',err:'sync error — see Settings'}[s]+'</span>';
  const d=$('#syncDetail');if(d)d.textContent=s==='err'?msg:s==='ok'?'Last synced '+new Date().toLocaleTimeString():'';}
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&unlocked)pullGist()});
window.addEventListener('beforeunload',e=>{if(pushT){pushGist();e.preventDefault();e.returnValue=''}});
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('on'),1800)}

/* ---------------- storage safety ----------------
   Ask the browser to keep THIS site's storage (it then won't auto-delete it when the
   device is low on space). Users can still clear it themselves. Asked once per device. */
let persistSt=null; // true / false / null (unsupported)
async function checkPersist(ask){
  if(!navigator.storage?.persisted){persistSt=null;return}
  persistSt=await navigator.storage.persisted();
  if(!persistSt&&(ask||!localStorage.getItem('opuos.persistAsked'))){localStorage.setItem('opuos.persistAsked','1');persistSt=await navigator.storage.persist().catch(()=>false)}
  if(view==='settings')render();
}
const isIOS=/iPhone|iPad|iPod/.test(navigator.userAgent),isStandalone=matchMedia('(display-mode: standalone)').matches||navigator.standalone;
const daysSince=d=>d?Math.floor((Date.now()-new Date(d+'T00:00'))/864e5):null;
const backupDue=()=>{const n=daysSince(S.lastBackup),snooze=localStorage.getItem('opuos.snooze');return (n==null||n>=14)&&!(snooze&&snooze>today())};
const kb=n=>n>=1048576?(n/1048576).toFixed(1)+' MB':Math.max(1,Math.round(n/1024))+' KB';

/* ---------------- cloud version history (every sync is a Gist revision) ---------------- */
const vSummary=d=>`${(d.sessions||[]).length} sessions · ${(d.reviewLog||[]).length} reviews done · ${(d.notes||[]).filter(n=>n.type==='journal').length} journal · ${(d.plans||[]).length} plans`;
async function historyModal(){
  const c=syncCfg(),rp=(()=>{try{return JSON.parse(localStorage.getItem(REPL))}catch(e){return null}})();
  $('#modal').innerHTML=`<h3>Cloud version history</h3>
    <p class="muted" style="font-size:14px;margin:-6px 0 12px">Every sync saves a version in your private Gist. Check a version to see what's in it, then restore it. Restoring makes it the newest version; nothing is deleted.</p>
    <div class="faint mono" style="font-size:12px;margin-bottom:8px">Now on this device: ${vSummary(S)}</div>
    ${rp?`<div class="li" style="flex-wrap:wrap;border:1px dashed var(--line2);border-radius:10px;padding:10px;margin-bottom:12px"><div class="grow"><div>This device's copy from ${new Date(rp.at).toLocaleString()}</div><div class="faint mono" style="font-size:11px">replaced when it ${esc(rp.reason)} · ${vSummary(rp.data)}</div></div><button class="btn sm" id="rpRestore">Restore</button></div>`:''}
    <div id="hist" class="list" style="max-height:46vh;overflow:auto"><div class="faint pulse">Loading versions…</div></div>
    <div class="mfoot"><button class="btn" id="mCancel">Close</button></div>`;
  $('#modalWrap').classList.add('on');$('#mCancel').onclick=closeModal;
  const restore=(data,why)=>{if(!confirm('Restore this version? Your current data is kept as a backup you can switch back to.'))return;stash(why);S=data;migrate();save();closeModal();render();toast('Version restored')};
  if(rp)$('#rpRestore').onclick=()=>restore(rp.data,'restored an earlier copy');
  if(!c?.gistId){$('#hist').innerHTML='<div class="empty">Cloud sync is off, so there is no cloud history.</div>';return}
  try{
    const L=await ghApi(`gists/${c.gistId}/commits?per_page=40`),got={};
    $('#hist').innerHTML=L.map((v,i)=>`<div class="li" style="flex-wrap:wrap"><div class="grow"><div>${new Date(v.committed_at).toLocaleString()}${i===0?' <span class="pill done">latest</span>':''}</div><div class="faint mono" style="font-size:11px" id="hv${i}"></div></div><button class="btn sm" data-hv="${esc(v.version)}" data-i="${i}">Check</button></div>`).join('')||'<div class="empty">No versions yet.</div>';
    $('#hist').onclick=async e=>{const b=e.target.closest('[data-hv]');if(!b)return;const i=b.dataset.i;
      if(got[i])return restore(got[i].data,'restored an older cloud version');
      b.textContent='…';
      try{const g=await ghApi(`gists/${c.gistId}/${b.dataset.hv}`),f=g.files[GF],r=JSON.parse(f.truncated?await fetch(f.raw_url).then(x=>x.text()):f.content);
        got[i]=r;$('#hv'+i).textContent=`saved ${new Date(r.savedAt).toLocaleString()} · ${vSummary(r.data)}`;b.textContent='Restore';b.classList.add('pri')}
      catch(err){b.textContent='Check';$('#hv'+i).textContent=err.message}};
  }catch(err){$('#hist').innerHTML=`<div class="empty" style="color:var(--red)">${esc(err.message)}</div>`}
}

/* ---------------- lock ---------------- */
/* Owner-only lock. The code holds only a slow, salted PBKDF2 hash of the owner's passphrase —
   never the passphrase. Set or change it with tools/set_owner.py, then push. Visitors can't
   create their own passphrase. (The code is public, so this keeps people out of the UI; the
   real data lives in the owner's browser and private Gist, never in this file.) */
const OWNER={salt:'1e443741ba2ae0d0d10bfee4277a61c2',iter:600000,hash:'e524a1244be5180283e2323af8e82313c19895f8926598d889135c14e99885a4'};
const hex=b=>[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
async function ownerHash(pw){
  const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);
  const salt=new Uint8Array(OWNER.salt.match(/../g).map(h=>parseInt(h,16)));
  return hex(await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt,iterations:OWNER.iter},k,256));
}
function initLock(){
  const ready=/^[0-9a-f]{64}$/.test(OWNER.hash);
  if(!ready){$('#lockMsg').textContent='Not set up yet: run tools/set_owner.py to add the owner passphrase.';$('#lockForm').style.display='none'}
  $('#lockForm').onsubmit=async e=>{
    e.preventDefault();const v=$('#lockInput').value,btn=$('#lockBtn');if(!v)return;
    btn.disabled=true;btn.textContent='Checking…';$('#lockErr').textContent='';
    let ok=false,err='';
    try{if(!window.crypto?.subtle)throw new Error('This browser blocks secure crypto here: open the https:// site.');ok=await ownerHash(v)===OWNER.hash}catch(x){err=x.message||String(x)}
    btn.disabled=false;btn.textContent='Unlock →';
    if(err){$('#lockErr').textContent=err;return}
    if(!ok){$('#lockErr').textContent='ACCESS DENIED';$('#lockInput').value='';return}
    sessionStorage.setItem(SKEY,'1');enter();
  };
  $('#restoreToggle').onclick=()=>{const f=$('#restoreForm');f.style.display=f.style.display==='none'?'block':'none';$('#restoreToken').focus()};
  $('#restoreForm').onsubmit=async e=>{
    e.preventDefault();const token=$('#restoreToken').value.trim();if(!token)return;
    $('#restoreErr').textContent='';$('#restoreBtn').textContent='Restoring…';
    try{
      const id=await findGist(token);
      if(!id)throw new Error('No OPU/OS data found on this GitHub account. Connect sync in Settings on your other browser first.');
      const r=await readGist(id,token);
      localStorage.setItem(KEY,JSON.stringify(r.data));setBase(r.savedAt);
      localStorage.setItem(SYNC,JSON.stringify({token,gistId:id}));location.reload();
    }catch(err){$('#restoreErr').textContent=err.message;$('#restoreBtn').textContent='Restore my data →'}
  };
  if(ready&&sessionStorage.getItem(SKEY))enter();
}
function enter(){$('#lock').style.display='none';$('#app').classList.add('on');if(localStorage.getItem('opuos.side'))$('#app').classList.add('collapsed');load();unlocked=true;loadGhNotes();setSync(syncCfg()?.gistId?'ok':'off');go(location.hash.slice(1)||'dash');renderTimer();checkSite();checkPersist();pullGist().then(()=>{if(S.settings.github&&(!S.gh||Date.now()-S.gh.at>36e5))syncGH(true)})}
function lock(){sessionStorage.removeItem(SKEY);location.reload()}

/* ---------------- stats helpers ---------------- */
const minsByDay=()=>{const m={};S.sessions.forEach(s=>m[s.date]=(m[s.date]||0)+(+s.minutes||0));return m};
function weekStart(){const d=new Date();const k=(d.getDay()+6)%7;d.setDate(d.getDate()-k);return dstr(d)}
function weekMinutes(){const ws=weekStart();return S.sessions.filter(s=>s.date>=ws).reduce((a,s)=>a+(+s.minutes||0),0)}
function streak(){const m=minsByDay();let d=today(),n=0;if(!m[d])d=addDays(d,-1);while(m[d]){n++;d=addDays(d,-1)}return n}
const solved=()=>S.sessions.reduce((a,s)=>a+(+s.problems||0),0);
const pct=t=>{const r=S.roadmap.filter(x=>!t||x.track===t);return r.length?Math.round(r.filter(x=>x.status==='done').length/r.length*100):0};
const hm=m=>m>=60?`${Math.floor(m/60)}h ${m%60?m%60+'m':''}`.trim():`${m}m`;

  const due=S.jobs.filter(j=>j.followUp&&j.followUp<=addDays(today(),3)&&!['rejected','offer'].includes(j.status)).sort((a,b)=>a.followUp.localeCompare(b.followUp));
  const gh=S.gh,nx=nextUp(),p=curPlan(),td=p?planToday(p):null;
  const tracks=tracksList().map(t=>[t,S.roadmap.filter(r=>r.track===t).length]).sort((a,b)=>b[1]-a[1]).slice(0,4).map(x=>x[0]);
  return `
  <div class="hero">

const MON={jan:0,feb:1,mar:2,apr:3,may:4,jun:5,jul:6,aug:7,sep:8,oct:9,nov:10,dec:11};
function parseDate(s){
  let m=s.match(/(\d{4})-(\d{2})-(\d{2})/);if(m)return new Date(+m[1],m[2]-1,+m[3]);
  m=s.match(/(\d{1,2})\s+([A-Za-z]{3})[a-z]*\.?,?\s+(\d{4})/);if(m&&MON[m[2].toLowerCase()]!=null)return new Date(+m[3],MON[m[2].toLowerCase()],+m[1]);
  m=s.match(/([A-Za-z]{3})[a-z]*\.?\s+(\d{1,2}),?\s+(\d{4})/);if(m&&MON[m[1].toLowerCase()]!=null)return new Date(+m[3],MON[m[1].toLowerCase()],+m[2]);
  return null;
}
const mondayOf=d=>{d=new Date(d);d.setDate(d.getDate()-((d.getDay()+6)%7));return dstr(d)};
const fmtLong=s=>new Date(s+'T00:00').toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});
/* Turns the Sunday planner's page (Markdown, as pasted or imported) into a structured plan. */
function parsePlan(src,week){
  const lines=src.replace(/\r/g,'').replace(/<br\s*\/?>/gi,'\n').split('\n');
  const p={id:uid(),title:'',week:week||'',intro:'',outcomes:[],outcomesNote:'',days:[],daysNote:'',watch:[],review:[],extra:'',raw:src,added:Date.now()};
  const buf={intro:[],outcomes:[],days:[],watch:[],review:[],extra:[]};let sec='intro';
  for(const l of lines){
    // headings arrive as "## Day by day" (Markdown) or as a bare line (plain-text paste)
    const h=l.match(/^#{1,4}\s+(.*)/)||l.trim().match(/^((?:\d+\s+)?must-do outcomes|day by day|watch out|end of week review.*)$/i);
    if(h){const t=h[1].toLowerCase();
      if(/week of/.test(t)&&!p.title&&sec==='intro'){p.title=h[1].replace(/^[^A-Za-z]+/,'').trim();continue}
      sec=/must|outcome|goal/.test(t)?'outcomes':/day by day|schedule|daily|days/.test(t)?'days':/watch|risk/.test(t)?'watch':/review/.test(t)?'review':'extra';
      if(sec==='extra')buf.extra.push(l);continue}
    if(sec==='intro'&&!p.title&&/^\W*week of\b/i.test(l.trim())){p.title=l.trim().replace(/^[^A-Za-z]+/,'');continue}
    buf[sec].push(l);
  }
  p.intro=buf.intro.map(l=>l.replace(/^>\s?/,'')).join('\n').trim();
  const items=arr=>{const out=[];let inItem=false;for(const l of arr){const m=l.match(/^\s*(?:\d+[.)]|[-*•])\s+(.*)/);if(m){out.push(m[1].trim());inItem=true}else if(l.trim()&&inItem&&/^\s{2,}/.test(l))out[out.length-1]+=' '+l.trim();else inItem=false}return out};
  p.outcomes=items(buf.outcomes).map(text=>({text,done:false}));
  p.outcomesNote=buf.outcomes.filter(l=>l.trim()&&!/^\s*(\d+[.)]|[-*•])\s/.test(l)).join(' ').trim();
  const notes=[];
  for(const l of buf.days){
    const t=l.trim();if(!t)continue;
    let cells=null;
    if(t.startsWith('|'))cells=t.replace(/^\||\|$/g,'').split('|').map(c=>c.trim());
    else if(t.includes('\t'))cells=t.split('\t').map(c=>c.trim());
    if(!cells){notes.push(t);continue}
    if(cells.every(c=>/^:?-{2,}:?$/.test(c)||!c)||/^day$/i.test(cells[0]))continue;
    p.days.push(cells.length>=3?{day:cells[0],focus:cells[1],plan:cells.slice(2).join(' '),done:false}:{day:cells[0],focus:'',plan:cells[1]||'',done:false});
  }
  p.daysNote=notes.join(' ');
  p.watch=items(buf.watch).filter(Boolean);
  p.review=buf.review.map(l=>l.match(/^\s*[-*•]\s+([^:]+):\s*(.*)$/)).filter(Boolean).map(m=>({q:m[1].trim(),a:m[2].trim()}));
  p.extra=buf.extra.join('\n').trim();
  if(!p.week){const d=parseDate(p.title)||parseDate(p.intro.slice(0,200));if(d)p.week=mondayOf(d)}
  if(!p.week)p.week=defaultPlanWeek();
  if(!p.title)p.title='Week of '+fmtLong(p.week);
  p.days.forEach((d,i)=>{const n=+(d.day.match(/\b(\d{1,2})\b/)||[])[1];let dt=addDays(p.week,i);if(n){for(let k=0;k<7;k++){const c=addDays(p.week,k);if(+c.slice(8)===n){dt=c;break}}}d.date=dt});
  return p;
}
const defaultPlanWeek=()=>new Date().getDay()===0?addDays(weekStart(),7):weekStart();
function curPlan(){
  if(planId){const p=S.plans.find(x=>x.id===planId);if(p)return p}

  return sorted.find(p=>p.week===ws)||sorted.find(p=>p.week<ws)||sorted.at(-1);
}

  return `${strip}${nextP&&nextP.id!==p.id?`<div class="banner"><span>📅 Next week's plan is ready: <strong>${esc(nextP.title)}</strong></span><button class="btn sm" data-act="openPlan" data-id="${nextP.id}">View →</button></div>`:''}
  ${!isCur&&p.week<ws&&!nextP?`<div class="banner" style="border-color:rgba(255,198,92,.35);background:rgba(255,198,92,.08)"><span>No plan for this week yet — showing the latest one.</span><button class="btn sm" data-act="pastePlan">+ Add this week's plan</button></div>`:''}

/* Notion copies rich HTML; convert it to Markdown so tables survive the paste. */
function htmlToMd(html){
  const doc=new DOMParser().parseFromString(html,'text/html'),out=[];
  const inline=n=>[...n.childNodes].map(c=>{if(c.nodeType===3)return c.textContent.replace(/\s+/g,' ');if(c.nodeType!==1)return '';const t=c.tagName,s=inline(c);
    if(t==='B'||t==='STRONG')return s.trim()?`**${s.trim()}**`:'';if(t==='EM'||t==='I')return s.trim()?`*${s.trim()}*`:'';if(t==='CODE')return '`'+c.textContent+'`';
    if(t==='A'&&/^https?:/.test(c.getAttribute('href')||''))return `[${s.trim()}](${c.getAttribute('href')})`;if(t==='BR')return '\n';
    if(/^(DIV|P|LI)$/.test(t))return s+' ';return s}).join('');
  const walk=(n,depth=0)=>{for(const c of n.childNodes){
    if(c.nodeType===3){const t=c.textContent.trim();if(t)out.push(t);continue}
    if(c.nodeType!==1)continue;const t=c.tagName;
    if(/^H[1-6]$/.test(t))out.push('','#'.repeat(Math.min(+t[1],3))+' '+inline(c).trim(),'');
    else if(t==='P'){const s=inline(c).trim();if(s)out.push(s,'')}
    else if(t==='BLOCKQUOTE'){inline(c).trim().split('\n').forEach(x=>out.push('> '+x.trim()));out.push('')}
    else if(t==='UL'||t==='OL'){[...c.children].forEach((li,i)=>{const own=li.cloneNode(true);own.querySelectorAll('ul,ol').forEach(x=>x.remove());out.push('  '.repeat(depth)+(t==='OL'?`${i+1}. `:'- ')+inline(own).trim());li.querySelectorAll(':scope > ul, :scope > ol').forEach(x=>{const w=document.createElement('div');w.appendChild(x.cloneNode(true));walk(w,depth+1)})});out.push('')}
    else if(t==='TABLE'){const rows=[...c.querySelectorAll('tr')].map(tr=>[...tr.children].map(td=>inline(td).replace(/\|/g,'/').replace(/\s+/g,' ').trim()));if(rows.length){out.push('| '+rows[0].join(' | ')+' |','| '+rows[0].map(()=>'---').join(' | ')+' |');rows.slice(1).forEach(r=>out.push('| '+r.join(' | ')+' |'));out.push('')}}
    else if(t==='PRE')out.push('```',c.textContent,'```','');
    else if(t==='HR')out.push('---','');
    else if(/^(SCRIPT|STYLE|META|TITLE)$/.test(t)){}
    else walk(c,depth)}};
  walk(doc.body);return out.join('\n').replace(/\n{3,}/g,'\n\n').trim();
}

/* ----- quizzes: scores read from the quiz files' "First attempt: x/10" header ----- */
function parseQuiz(t){
  const num=s=>+s;
  const fa=t.match(/first attempt:\s*([\d.]+)\s*\/\s*([\d.]+)/i),rd=t.match(/redo[^:\n]*:\s*([\d.]+)\s*\/\s*([\d.]+)/i);
  const head=t.split('\n').slice(0,14).join('\n');
  const cl=head.split('\n').filter(l=>/corrected/i.test(l)&&!/first attempt and the corrected/i.test(l)).join(' ');
  const corrected=[...new Set(cl.match(/Q\d+(?:\([a-z]\))?/g)||[])];
  // Question text: math quizzes put it in the heading ("## Q3. Simplify…", "### (b) …");
  // DSA quizzes put it in a bold line under "## Q3". Code blocks are skipped.
  const prompts={},body={};let q=null,part=null,fence=false;
  for(const l of t.split('\n')){
    if(/^\s*```/.test(l)){fence=!fence;continue}if(fence)continue;
    let m=l.match(/^##\s+Q(\d+)\b\.?\s*(?:\([^)]*\))?\s*(.*)$/);
    if(m){q=m[1];part=null;if(m[2].trim())prompts[q]=m[2].trim();body[q]=[];continue}
    m=l.match(/^###\s+\(([a-z])\)\s*(.*)$/);
    if(m&&q){part=`${q}(${m[1]})`;if(m[2].trim())prompts[part]=m[2].trim();continue}
    if(/^#{1,2}\s/.test(l)){q=null;continue}
    if(q&&l.trim()&&body[q].length<10&&!/^#/.test(l))body[q].push(l.trim());
  }
  for(const [k,ls] of Object.entries(body))if(!prompts[k]){const b=ls.find(l=>/^\*\*/.test(l));if(b)prompts[k]=b}
  for(const k in prompts)prompts[k]=prompts[k].replace(/\*\*/g,'').slice(0,240);
  return {score:fa?num(fa[1]):null,outOf:fa?num(fa[2]):null,redo:rd?num(rd[1]):null,corrected,prompts};
}

    const score=q.score??(m?+m.score:null),outOf=q.outOf??(m?+m.outOf||10:null);
    return {n,loaded:t!=null,manual:q.score==null&&!!m,score,outOf,pctv:score!=null&&outOf?Math.round(score/outOf*100):null,redo:q.redo,corrected:q.score!=null?q.corrected:(m?.corrected||'').match(/Q\d+(?:\([a-z]\))?/g)||[],prompts:q.prompts};

}

  return out.filter(i=>!(S.review[i.key]?.step>=99));

function reviewQueue(){
  const all=reviewItems(),t=today(),newToday=S.reviewNew?.date===t?S.reviewNew.n:0,cap=+S.settings.newPerDay||5;

  const total=Object.values(byLang).reduce((a,b)=>a+b,0),langs=Object.entries(byLang).sort((a,b)=>b[1]-a[1]);

}

/* ---------------- Markdown → HTML (escaped first, so note text can't inject HTML) ---------------- */
function inl(x){
  const cs=[];x=x.replace(/`([^`]+)`/g,(_,c)=>{cs.push(c);return `\u0001${cs.length-1}\u0001`});
  x=x.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/(^|[^\w*\\])\*(?![\s*])([^*\n]*?[^\s*\\])\*(?!\w)/g,'$1<em>$2</em>')
     .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>').replace(/\\([*_`\[\]#<>|-])/g,'$1');
  return x.replace(/\u0001(\d+)\u0001/g,(_,i)=>`<code>${cs[i]}</code>`);
}
function md(s){
  const blocks=[];s=esc(s||'').replace(/\r/g,'').replace(/```[^\n]*\n?([\s\S]*?)```/g,(_,c)=>{blocks.push(c.replace(/\n$/,''));return `\n\u0000${blocks.length-1}\u0000\n`});
  const L=s.split('\n');let h='',list=null;
  const close=()=>{if(list){h+=`</${list.split(' ')[0]}>`;list=null}};
  const open=tag=>{if(list!==tag){close();h+=`<${tag}>`;list=tag}};
  const row=r=>r.trim().replace(/^\||\|$/g,'').split('|').map(c=>c.trim());
  for(let i=0;i<L.length;i++){
    const t=L[i].trim();let m;
    if(/^\u0000\d+\u0000$/.test(t)){close();h+=t;continue}
    if(t.startsWith('|')&&L[i+1]&&/^\s*\|?\s*:?-{2,}/.test(L[i+1])){close();const hd=row(t);i++;let body='';while(L[i+1]?.trim().startsWith('|')){i++;body+=`<tr>${row(L[i]).map(c=>`<td>${inl(c)}</td>`).join('')}</tr>`}h+=`<table><tr>${hd.map(c=>`<th>${inl(c)}</th>`).join('')}</tr>${body}</table>`;continue}
    if(m=t.match(/^[-*+] \[( |x|X)\] (.*)/)){open('ul class="tasks"');h+=`<li><input type="checkbox" disabled ${m[1]!==' '?'checked':''}>${inl(m[2])}</li>`;continue}
    if(m=t.match(/^[-*+] (.*)/)){open('ul');h+=`<li>${inl(m[1])}</li>`;continue}
    if(m=t.match(/^(\d+)[.)] (.*)/)){open('ol');h+=`<li value="${m[1]}">${inl(m[2])}</li>`;continue}
    if(!t&&list&&/^\s*([-*+]|\d+[.)]) /.test(L[i+1]||''))continue;
    close();
    if(m=t.match(/^(#{1,4}) (.*)/)){h+=`<h${m[1].length}>${inl(m[2])}</h${m[1].length}>`;continue}
    if(/^(-{3,}|\*{3,}|_{3,})$/.test(t)){h+='<hr>';continue}
    if(t.startsWith('&gt;')){const q=[t.replace(/^&gt;\s?/,'')];while(L[i+1]?.trim().startsWith('&gt;')){i++;q.push(L[i].trim().replace(/^&gt;\s?/,''))}h+=`<blockquote>${q.map(inl).join('<br>')}</blockquote>`;continue}
    if(t)h+=`<p>${inl(t)}</p>`;
  }
  close();
  return h.replace(/\u0000(\d+)\u0000/g,(_,i)=>`<pre><code>${blocks[i]}</code></pre>`);
}

let siteState='chk';
async function checkSite(){
  siteState='chk';paintSite();const c=new AbortController();const t=setTimeout(()=>c.abort(),8000);
  try{await fetch(S.settings.site,{mode:'no-cors',cache:'no-store',signal:c.signal});siteState='up'}catch(e){siteState='down'}

}

/* ---------------- forms ---------------- */
function form(title,fields,vals,onSave,onDel){
  $('#modal').innerHTML=`<h3>${title}</h3>${fields.map(f=>{const v=esc(vals[f.k]??'');const inp=f.type==='textarea'?`<textarea name="${f.k}">${v}</textarea>`:f.type==='select'?`<select name="${f.k}">${f.opts.map(o=>{const[val,lab]=Array.isArray(o)?o:[o,o];return `<option value="${esc(val)}" ${String(vals[f.k])===String(val)?'selected':''}>${esc(lab)}</option>`}).join('')}</select>`:`<input name="${f.k}" type="${f.type||'text'}" value="${v}" ${f.type==='number'?'min="0"':''} placeholder="${esc(f.ph||'')}">`;return `<div class="field"><span class="label">${f.label}</span>${inp}</div>`}).join('')}
  <div class="mfoot">${onDel?'<button class="btn danger ghost left" id="mDel">Delete</button>':''}<button class="btn" id="mCancel">Cancel</button><button class="btn pri" id="mSave">Save</button></div>`;
  $('#modalWrap').classList.add('on');setTimeout(()=>$('#modal input, #modal textarea')?.focus(),30);
  $('#mCancel').onclick=closeModal;
  $('#mSave').onclick=()=>{const o={};fields.forEach(f=>{const el=$(`#modal [name="${f.k}"]`);o[f.k]=f.type==='number'?+el.value:el.value});onSave(o);save();closeModal();render()};
  if(onDel)$('#mDel').onclick=()=>{if(confirm('Delete this?')){onDel();save();closeModal();render()}};
}

/* Merge an import file (made from Notion) into the current data. Re-importing updates, never duplicates. */
function mergeImport(d){
  const c={road:0,plans:0,notes:0,lc:0};
  if(d.roadmap?.length){
    const tracks=new Set(d.roadmap.map(r=>r.track)),old=S.roadmap.filter(r=>!r.nid&&tracks.has(r.track));
    if(old.length&&confirm(`Your Notion roadmap has a ${[...new Set(old.map(o=>o.track))].join(', ')} track. Remove the ${old.length} starter item(s) already in it so they don't mix?`))S.roadmap=S.roadmap.filter(r=>!old.includes(r));
    d.roadmap.forEach(r=>{const e=S.roadmap.find(x=>x.nid===r.nid);if(e)Object.assign(e,r);else S.roadmap.push({id:uid(),...r});c.road++});
  }
  (d.roadmapPatch||[]).forEach(p=>{const e=S.roadmap.find(x=>x.track===p.track&&x.title===p.title);if(e)Object.assign(e,p.set)});
  (d.notes||[]).forEach(n=>{const e=S.notes.find(x=>x.nid&&x.nid===n.nid);if(e)Object.assign(e,n);else S.notes.push({id:uid(),tags:[],subject:'',topic:'',updated:Date.now(),...n});c.notes++});
  (d.plans||[]).forEach(r=>{const p=parsePlan(r.md,r.week);Object.assign(p,{nid:r.nid,url:r.url});if(r.title)p.title=r.title;
    const i=S.plans.findIndex(x=>x.week===p.week);if(i>=0){const o=S.plans[i];p.id=o.id;p.days.forEach((x,k)=>{if(o.days[k]?.day===x.day)x.done=o.days[k].done});p.outcomes.forEach((x,k)=>{if(o.outcomes[k])x.done=o.outcomes[k].done});S.plans[i]=p}else S.plans.push(p);c.plans++});
  (d.leetcode||[]).forEach(p=>{const e=S.leetcode.find(x=>x.num===p.num);if(e)Object.assign(e,p,{last:e.last,prev:e.prev,count:Math.max(e.count||0,p.count||0)});else S.leetcode.push({id:uid(),last:'',...p});c.lc++});
  if(d.lcRound&&!S.leetcode.some(p=>p.last))S.lcRound=d.lcRound;
  planId=null;save();render();toast(`Imported: ${c.road} roadmap · ${c.plans} plans · ${c.notes} notes · ${c.lc} problems`);
}
const del=(arr,id)=>()=>S[arr]=S[arr].filter(x=>x.id!==id);

  nType:d=>{nType=d.v;render()},
  nSort:d=>{nSort=d.v;render()},
  nm:d=>{noteMode=d.m;render()},
  openNote:d=>{noteId=d.id;nOpen=true;render();if(innerWidth<=980)scrollTo(0,0)},
  nBack:()=>{nOpen=false;render()},
  openCode:d=>{const c=ghIdx?.code?.find(x=>x.id===d.id);if(!c)return;codeId=c.id;if(view!=='notes'||nView!=='code'){cRepo=c.repo;cSec=c.sec;cLang='all';cQ=''}nView='code';nOpen=true;go('notes');if(innerWidth<=980)scrollTo(0,0)},
  cLang:d=>{cLang=d.v;nOpen=false;render()},
  copyCode:d=>{const c=ghIdx?.code?.find(x=>x.id===d.id),t=c&&ghBody[c.sha];if(t==null)return;navigator.clipboard?.writeText(t).then(()=>toast('Copied'),()=>toast('Copy blocked by the browser'))},
  nFocus:()=>{nFocus=!nFocus;localStorage.setItem('opuos.nfocus',nFocus?'1':'');render()},
  ghNotes:()=>{toast('Reading your GitHub repos…');loadGhNotes(true)},
  newNote:d=>{const n={id:uid(),type:'note',title:'',body:'',tags:[],subject:nSubj&&nSubj!=='Unsorted'?nSubj:'',topic:nTopic&&nTopic!=='General'?nTopic:'',updated:Date.now()};S.notes.push(n);noteId=n.id;nOpen=true;nView='notes';nSrc='all';nType='all';nQ='';noteMode='edit';save();go('notes');setTimeout(()=>$('#nTitle')?.focus(),20)},
  pinNote:()=>{const n=S.notes.find(x=>x.id===noteId);n.pinned=!n.pinned;save();render()},
  delNote:()=>{if(confirm('Delete this note?')){S.notes=S.notes.filter(n=>n.id!==noteId);noteId=null;nOpen=false;save();render()}},
  newJournal:d=>{
    if(d.k==='daily'){const e=S.notes.find(n=>isJ(n)&&n.kind!=='review'&&n.date===today());if(e){jId=e.id;nView='journal';noteMode='edit';go('notes');return}}
    const rv=d.k==='review',p=curPlan();
    const n={id:uid(),type:'journal',kind:rv?'review':'daily',date:today(),tags:[],subject:'',topic:'',updated:Date.now(),
      title:rv?'Weekly review — week of '+fmtLong(weekStart()):new Date().toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'}),
      body:rv?`## Wins this week\n\n\n## What didn't go to plan\n\n\n## Topics that need relearning\n\n\n## Numbers\n\n- Study time: ${hm(weekMinutes())}\n- Plan days done: ${p?p.days.filter(x=>x.done).length+'/'+p.days.length:'—'}\n- LeetCode revised this round: ${lcRevised()}/${S.leetcode.length}\n- Reviews done: ${reviewsBetween(weekStart(),addDays(weekStart(),6))}\n\n## Next week's focus\n`
        :'## What I did today\n\n\n## What I learned\n\n\n## What blocked me\n\n\n## Tomorrow\n'};
    S.notes.push(n);jId=n.id;nOpen=true;nView='journal';noteMode='edit';save();go('notes');setTimeout(()=>$('#nBody')?.focus(),20)},
  openJ:d=>{jId=d.id;nOpen=true;render();if(innerWidth<=980)scrollTo(0,0)},
  jMood:d=>{const n=S.notes.find(x=>x.id===jId);n.mood=n.mood===+d.v?0:+d.v;save();render()},
  delJ:()=>{if(confirm('Delete this journal entry?')){S.notes=S.notes.filter(n=>n.id!==jId);jId=null;save();render()}},
  saveSettings:()=>{const g=$('#sGh').value.trim(),ch=g!==S.settings.github,repos=$('#sRepos').value.split(',').map(x=>x.trim()).filter(Boolean),crepos=$('#sCode').value.split(',').map(x=>x.trim()).filter(Boolean);Object.assign(S.settings,{name:$('#sName').value,github:g,site:$('#sSite').value,weeklyGoal:+$('#sGoal').value||20,noteRepos:repos,codeRepos:crepos});if(ch)S.gh=null;save();toast('Saved');if(ch&&g)syncGH();checkSite();loadGhNotes(true)},
  history:historyModal,
  snooze:()=>{localStorage.setItem('opuos.snooze',addDays(today(),3));render()},
  persist:()=>checkPersist(true).then(()=>toast(persistSt?'Browser will keep this data':'Browser said no — keep sync on and export backups')),
  syncOn:()=>{const t=$('#sTok').value.trim();if(t)connectSync(t)},
  syncNow:async()=>{await pullGist();if(syncSt.s!=='err')await pushGist();toast(syncSt.s==='err'?syncSt.msg:'Synced')},
  syncOff:()=>{if(confirm('Disconnect cloud sync on this browser? (Your Gist is kept.)')){localStorage.removeItem(SYNC);setSync('off');render()}},
  export:()=>{S.lastBackup=today();save();localStorage.removeItem('opuos.snooze');if(['dash','settings'].includes(view))render();const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,2)],{type:'application/json'}));a.download=`opuos-backup-${today()}.json`;a.click()},
  import:()=>{const f=$('#impFile');f.onchange=()=>{const r=new FileReader();r.onload=()=>{let d;try{d=JSON.parse(r.result)}catch(e){return toast('Invalid file')}
      if(d.opuosImport)return mergeImport(d);
      if(!d.settings)return toast('Invalid file');
      if(!confirm('This is a full backup — it will REPLACE all current data. Continue?'))return;
      S=d;migrate();save();toast('Imported');render()};r.readAsText(f.files[0]);f.value=''};f.click()},
  reset:()=>{if(confirm('Wipe ALL data and start fresh?')){localStorage.removeItem(KEY);load();render();toast('Reset')}},
  timerStart:d=>startTimer(+d.m), timerStop:stopTimer, timerLog:()=>finishTimer(true),
};
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el)return;const f=A[el.dataset.act];if(f){f(el.dataset,e)}});
$('#modalWrap').addEventListener('click',e=>{if(e.target.id==='modalWrap')closeModal()});

/* ---------------- focus timer ---------------- */
let T={run:false,end:0,mins:25,start:0,iv:null};
function renderTimer(){
  const el=$('#timer');el.classList.toggle('run',T.run);
  $('#timerRow').innerHTML=T.run?`<button class="btn sm" data-act="timerStop">■ Stop</button><button class="btn sm" data-act="timerLog">✓ Log now</button>`:`<button class="btn sm" data-act="timerStart" data-m="25">25</button><button class="btn sm" data-act="timerStart" data-m="50">50</button><button class="btn sm" data-act="timerStart" data-m="90">90</button>`;
  tick();
}
function tick(){const left=T.run?Math.max(0,T.end-Date.now()):T.mins*6e4;const m=Math.floor(left/6e4),s=Math.floor(left/1e3)%60;$('#timerT').textContent=`${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;$('#mTimer').textContent=T.run?'● '+$('#timerT').textContent:'';document.title=T.run?`${$('#timerT').textContent} · focus — OPU/OS`:'OPU/OS — Command Center';if(T.run&&left<=0)finishTimer(false)}
function startTimer(m){T={run:true,mins:m,start:Date.now(),end:Date.now()+m*6e4,iv:setInterval(tick,500)};renderTimer();toast(`Focus ${m}m — go.`)}
function stopTimer(){clearInterval(T.iv);T.run=false;renderTimer()}
function finishTimer(early){
  const mins=Math.max(1,Math.round((Date.now()-T.start)/6e4));stopTimer();
  if(!early)try{const c=new AudioContext(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=880;g.gain.setValueAtTime(.15,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+1.2);o.start();o.stop(c.currentTime+1.2)}catch(e){}
  A.logSession({}, {minutes:early?mins:T.mins});
}

/* ---------------- command palette ---------------- */
let palSel=0,palList=[];
function cmds(){
  return [
    ...[['dash','Dashboard'],['study','Study'],['skills','Skills'],['projects','Projects'],['career','Career'],['github','GitHub'],['notes','Notes & Journal'],['links','Presence'],['settings','Settings']].map(([v,l])=>({l:'Go to '+l,k:'nav',f:()=>go(v)})),
    {l:'Start focus · 25 min',k:'timer',f:()=>startTimer(25)},{l:'Start focus · 50 min',k:'timer',f:()=>startTimer(50)},
    {l:'Log study session',k:'study',f:()=>A.logSession({})},{l:'New application',k:'career',f:A.addJob},
    {l:'New note',k:'notes',f:()=>A.newNote({})},{l:"Today's journal entry",k:'journal',f:()=>A.newJournal({k:'daily'})},
    {l:'Sync GitHub',k:'github',f:()=>syncGH()},
    {l:"This week's plan",k:'study',f:()=>A.studyTab({t:'week'})},{l:'Add weekly plan',k:'study',f:pastePlanModal},{l:'LeetCode revision',k:'study',f:()=>A.studyTab({t:'leetcode'})},{l:'Roadmap',k:'study',f:()=>A.studyTab({t:'roadmap'})},
    {l:'Weekly review entry',k:'journal',f:()=>A.newJournal({k:'review'})},{l:'Review queue',k:'study',f:()=>A.studyTab({t:'review'})},{l:'Quiz scores',k:'study',f:()=>A.studyTab({t:'quizzes'})},{l:'Refresh GitHub notes',k:'notes',f:()=>loadGhNotes(true)},{l:'Export backup',k:'data',f:A.export},{l:'Lock',k:'system',f:lock},
    ...S.notes.map(n=>({l:n.title||'Untitled',k:n.type,f:()=>{if(isJ(n)){jId=n.id;nView='journal'}else{noteId=n.id;nView='notes';nSubj=nTopic=nQ='';nType=nSrc='all'}go('notes')}})),
    ...(ghIdx?.items||[]).map(n=>({l:`${n.subject} · ${n.topic} — ${n.title}`,k:n.type,f:()=>{noteId=n.id;nView='notes';nSubj=n.subject;nTopic=n.topic;nType='all';nSrc='all';nQ='';go('notes')}})),
    ...(ghIdx?.code||[]).map(c=>({l:`${c.name} — ${c.repo} · ${c.sec}`,k:'code',f:()=>A.openCode({id:c.id})})),
    ...S.roadmap.filter(r=>r.step!=null).map(r=>({l:`Step ${r.step} · ${r.title}`,k:'roadmap',f:()=>{studyTrack=r.track;A.studyTab({t:'roadmap'})}})),
    ...S.jobs.map(j=>({l:`${j.company} — ${j.role}`,k:'job',f:()=>A.editJob({id:j.id})})),
    ...S.projects.map(p=>({l:p.name,k:'project',f:()=>A.editProject({id:p.id})})),
  ];
}
function openPal(){ghLoadAll();$('#palWrap').classList.add('on');$('#palInput').value='';palSel=0;drawPal();$('#palInput').focus()}
function closePal(){$('#palWrap').classList.remove('on')}
/* Full-text: after title matches, list notes (GitHub + yours + journal) whose text contains the query, with a snippet. */
function textHits(q,skip){
  if(q.length<3)return [];
  const out=[],pool=[...allNotes(),...S.notes.filter(isJ)];
  for(const n of pool){const t=noteText(n),i=t.toLowerCase().indexOf(q);if(i<0||skip.has(n.title))continue;
    const snip=t.slice(Math.max(0,i-30),i+q.length+40).replace(/\s+/g,' ').trim();
    out.push({l:`${n.title}${n.topic?' · '+n.topic:''} — …${snip}…`,k:'in text',f:()=>{if(isJ(n)){jId=n.id;nView='journal'}else{noteId=n.id;nView='notes';nSubj=n.subject||'';nTopic=n.topic||'';nType='all';nSrc='all'}nQ='';go('notes')}});
    if(out.length>=8)break}
  return out;
}
function drawPal(){const q=$('#palInput').value.toLowerCase().trim();const hits=cmds().filter(c=>c.l.toLowerCase().includes(q));palList=[...hits.slice(0,8),...textHits(q,new Set(hits.map(h=>h.l)))].slice(0,14);palSel=Math.min(palSel,Math.max(0,palList.length-1));$('#palItems').innerHTML=palList.map((c,i)=>`<div class="it ${i===palSel?'on':''}" data-i="${i}"><span>${esc(c.l)}</span><span>${c.k}</span></div>`).join('')||'<div class="empty" style="padding:12px">No matches</div>'}
$('#palInput').oninput=()=>{palSel=0;drawPal()};
$('#palItems').onclick=e=>{const it=e.target.closest('.it');if(it){closePal();palList[+it.dataset.i].f()}};
$('#palWrap').addEventListener('click',e=>{if(e.target.id==='palWrap')closePal()});

document.addEventListener('keydown',e=>{
  if(!$('#app').classList.contains('on'))return;
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();$('#palWrap').classList.contains('on')?closePal():openPal();return}
  if($('#palWrap').classList.contains('on')){
    if(e.key==='Escape')closePal();
    else if(e.key==='ArrowDown'){palSel=Math.min(palSel+1,palList.length-1);drawPal();e.preventDefault()}
    else if(e.key==='ArrowUp'){palSel=Math.max(palSel-1,0);drawPal();e.preventDefault()}
    else if(e.key==='Enter'&&palList[palSel]){closePal();palList[palSel].f()}
    return;
  }
  if(e.key==='Escape'){closeModal();$('#app').classList.remove('drawer')}
  const tag=document.activeElement.tagName;if(['INPUT','TEXTAREA','SELECT'].includes(tag)||$('#modalWrap').classList.contains('on'))return;
  if(e.key==='[')return A.sideToggle();
  if(e.key==='\\'&&view==='notes'&&nView!=='journal')return A.nFocus();
  const v=['dash','study','skills','projects','career','github','notes','links','settings'][+e.key-1];if(v)go(v);
});
window.addEventListener('hashchange',()=>{const v=location.hash.slice(1);if(v!==view&&views[v])go(v)});

initLock();
